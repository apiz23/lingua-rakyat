<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lingua Rakyat">
  <title>Lingua Rakyat</title>
  <!--
    Lingua Rakyat — brand mark
    Concept: an official document page whose corner lifts into a speech bubble.
    The three content lines read as the three supported languages (MS / EN / ZH).
    Palette: civic green hue 152 (primary) oklch(0.42 0.1 152) = #135c30,
             warm paper neutral hue 85 (background) oklch(0.975 0.015 85) = #fbf6ec.
    Geometry is flat, angular and stroke-consistent: no gradients, no glow, no orbs.
  -->
  <rect width="64" height="64" rx="14" fill="#fbf6ec"/>
  <path d="M18 15h17.5L46 25.5V49a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3Z"
        fill="#135c30"/>
  <path d="M35.5 15 46 25.5h-7.5a3 3 0 0 1-3-3V15Z" fill="#fbf6ec" opacity="0.92"/>
  <g fill="#fbf6ec">
    <rect x="21" y="31" width="16" height="3.4" rx="1.7"/>
    <rect x="21" y="38" width="20" height="3.4" rx="1.7"/>
    <rect x="21" y="45" width="12" height="3.4" rx="1.7"/>
  </g>
  <path d="M40.5 40.5h8a5 5 0 0 1 5 5v3a5 5 0 0 1-5 5h-3.4l-4.6 4v-4h-.0a5 5 0 0 1-5-5v-3a5 5 0 0 1 5-5Z"
        fill="#278733"/>
</svg>
