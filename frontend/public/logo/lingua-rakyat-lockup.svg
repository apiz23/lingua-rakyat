<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Lingua Rakyat">
  <title>Lingua Rakyat — horizontal lockup</title>
  <!--
    Horizontal lockup: mark + wordmark.
    Wordmark face: Bricolage Grotesque (the app heading font); falls back to a
    neutral grotesque. Letter-spacing tightened per brand (tracking heading = 0).
    Palette: civic green #135c30 on transparent (pair on the warm paper #fbf6ec).
  -->
  <g transform="translate(0 0)">
    <path d="M18 15h17.5L46 25.5V49a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3Z" fill="#135c30"/>
    <path d="M35.5 15 46 25.5h-7.5a3 3 0 0 1-3-3V15Z" fill="#fbf6ec"/>
    <g fill="#fbf6ec">
      <rect x="21" y="31" width="16" height="3.4" rx="1.7"/>
      <rect x="21" y="38" width="20" height="3.4" rx="1.7"/>
      <rect x="21" y="45" width="12" height="3.4" rx="1.7"/>
    </g>
    <path d="M40.5 40.5h8a5 5 0 0 1 5 5v3a5 5 0 0 1-5 5h-3.4l-4.6 4v-4a5 5 0 0 1-5-5v-3a5 5 0 0 1 5-5Z" fill="#278733"/>
  </g>
  <text x="72" y="33" font-family="'Bricolage Grotesque', 'Space Grotesk', ui-sans-serif, system-ui, sans-serif"
        font-size="25" font-weight="600" letter-spacing="-0.6" fill="#135c30">Lingua</text>
  <text x="72" y="54" font-family="'Bricolage Grotesque', 'Space Grotesk', ui-sans-serif, system-ui, sans-serif"
        font-size="14" font-weight="500" letter-spacing="3.2" fill="#135c30" opacity="0.72">RAKYAT</text>
</svg>
